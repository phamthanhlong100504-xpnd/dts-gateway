server:
  port: 8888
  address: 0.0.0.0

jwt:
  secret: "${JWT_ACCESS_SECRET:uPq3xK8mR5vY2wZ9aB4cD7eF1gH3iJ6kL0nO5pQ8rS2tU4vW6xY9zA1bC3dE7fG9}"

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: ${EUREKA_ENABLED:false}
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://hoangcn.com:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # 1. Identity Service
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://dts-identity-service:8081}
          predicates:
            - Path=/api/identity/**, /api/v1/auth/**, /api/v1/users/**
          filters:
            - RewritePath=/api/identity/v1/(?<segment>.*), /api/v1/$\{segment}

        # 2. Practice Service & Question Images
        - id: practice-service
          uri: ${PRACTICE_SERVICE_URL:http://dts-practice-service:8087}
          predicates:
            - Path=/api/practice/**, /api/v1/practices/**, /api/v1/exams/**, /api/v1/questions/**, /api/v1/exam-sessions/**
          filters:
            - RewritePath=/api/practice/v1/(?<segment>.*), /api/v1/$\{segment}

        - id: practice-question-images
          uri: ${PRACTICE_SERVICE_URL:http://dts-practice-service:8087}
          predicates:
            - Path=/question-images/**

        # 3. Progress Service
        - id: progress-service
          uri: ${PROGRESS_SERVICE_URL:http://dts-progress:8083}
          predicates:
            - Path=/api/progress/**, /api/v1/progress/**
          filters:
            - RewritePath=/api/progress/v1/(?<segment>.*), /api/v1/$\{segment}

        # 4. Content Builder Service
        - id: content-builder-service
          uri: ${CONTENT_BUILDER_SERVICE_URL:http://content-builder:8082}
          predicates:
            - Path=/api/content-builder/**
          filters:
            - RewritePath=/api/content-builder/v1/(?<segment>.*), /api/v1/content-builder/$\{segment}

        # 5. Examination Service
        - id: examination-service
          uri: ${EXAMINATION_SERVICE_URL:http://examination:8088}
          predicates:
            - Path=/api/examination/**
          filters:
            - RewritePath=/api/examination/v1/(?<segment>.*), /api/v1/$\{segment}

        # 6. Result Service
        # dts-result không có prefix /api/v1 — endpoints ở dạng /v1/results/me/**
        # → bỏ hoàn toàn prefix /api/result, giữ nguyên phần còn lại (gồm /v1/...)
        # dts-result deploy trên VPS hoangcn.com (36.50.176.197), KHÔNG cùng docker host với
        # gateway → dùng public address (container name `dts-result` không resolve được ở đây)
        - id: result-service
          uri: ${RESULT_SERVICE_URL:http://hoangcn.com:8086}
          predicates:
            - Path=/api/result/**
          filters:
            - RewritePath=/api/result/(?<segment>.*), /$\{segment}

        # 7. Media Service
        - id: media-service
          uri: ${MEDIA_SERVICE_URL:http://dts-media:8080}
          predicates:
            - Path=/api/v1/media/**

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.http.server.reactive: INFO

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: ${EUREKA_ENABLED:false}
    fetch-registry: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
