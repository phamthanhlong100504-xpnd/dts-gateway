name: VPS Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Diagnostics on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "=== DOCKER PS ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "=== TEST DIRECT PRACTICE PORT 8087 ==="
            curl -v http://localhost:8087/actuator/health || true
            echo "=== TEST GATEWAY PORT 8888 ==="
            curl -v http://localhost:8888/actuator/health || true
