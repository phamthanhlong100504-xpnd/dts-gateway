name: VPS Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Diagnostics on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "=== ALL DOCKER CONTAINERS (PS -A) ==="
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "=== MEDIA-SERVICE LOGS ==="
            docker logs media-service --tail 100 || true
            echo "=== MEDIA-MINIO LOGS ==="
            docker logs media-minio --tail 50 || true
            echo "=== KAFKA LOGS ==="
            docker logs kafka --tail 50 || true
            echo "=== ZOOKEEPER LOGS ==="
            docker logs media-zookeeper --tail 50 || true
            echo "=== PRACTICE SERVICE LOGS ==="
            docker logs dts-practice-service --tail 100 || true

