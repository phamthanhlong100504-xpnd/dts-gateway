name: VPS Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Diagnostics on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          timeout: 10m
          script: |
            echo "=== RUN E2E TEST INSIDE DTS-NETWORK ==="
            docker run --rm --network dts-network -v /dts/practice-service/.env:/env:ro python:3.11-slim python3 - << 'EOF'
            import urllib.request, json, time, uuid, hmac, hashlib, base64, os

            def post(url, data=None, token=None, method='POST'):
                headers = {'Content-Type': 'application/json'}
                if token:
                    headers['Authorization'] = f'Bearer {token}'
                body = json.dumps(data).encode('utf-8') if data else None
                req = urllib.request.Request(url, data=body, headers=headers, method=method)
                try:
                    with urllib.request.urlopen(req) as resp:
                        return resp.status, json.loads(resp.read().decode())
                except urllib.error.HTTPError as e:
                    return e.code, json.loads(e.read().decode())
                except Exception as e:
                    return 500, {'error': str(e)}

            def get(url, token=None):
                headers = {}
                if token:
                    headers['Authorization'] = f'Bearer {token}'
                req = urllib.request.Request(url, headers=headers)
                try:
                    with urllib.request.urlopen(req) as resp:
                        return resp.status, json.loads(resp.read().decode())
                except urllib.error.HTTPError as e:
                    return e.code, json.loads(e.read().decode())
                except Exception as e:
                    return 500, {'error': str(e)}

            # 1. Read JWT secret from mounted .env
            secret_str = 'uPq3xK8mR5vY2wZ9aB4cD7eF1gH3iJ6kL0nO5pQ8rS2tU4vW6xY9zA1bC3dE7fG9'
            if os.path.exists('/env'):
                with open('/env') as f:
                    for line in f:
                        if line.startswith('JWT_ACCESS_SECRET='):
                            val = line.strip().split('=', 1)[1]
                            if val:
                                secret_str = val

            try:
                key = base64.b64decode(secret_str)
            except Exception:
                try:
                    key = base64.urlsafe_b64decode(secret_str + '===')
                except Exception:
                    key = secret_str.encode('utf-8')

            if len(key) < 32:
                key = hashlib.sha256(key).digest()

            def b64url(b):
                return base64.urlsafe_b64encode(b).decode('utf-8').rstrip('=')

            now = int(time.time())
            header = {'alg': 'HS256', 'typ': 'JWT'}
            payload = {
                'iss': 'dts-identity-service',
                'sub': '870810b3-b42f-4efc-aef8-605534e7bc24',
                'username': 'longpt',
                'roles': ['ROLE_ADMIN', 'ROLE_STUDENT'],
                'permissions': [
                    'simulations:read', 'simulations:learn', 'media:read',
                    'practice:read', 'practice:learn', 'practice:exam'
                ],
                'iat': now,
                'exp': now + 7200
            }
            d_sign = f"{b64url(json.dumps(header).encode())}.{b64url(json.dumps(payload).encode())}"
            sig = hmac.new(key, d_sign.encode(), hashlib.sha256).digest()
            token = f"{d_sign}.{b64url(sig)}"
            print('1. Minted JWT token successfully for longpt')

            BASE = 'http://dts-practice-service:8087/api/v1/simulations'

            # 2. Get scenario 1
            code, scen_res = get(f'{BASE}/chapters/1/scenarios?licenseClass=B&bankVersion=dts-simulation-120-video-v1&filter=ALL&sort=SCENARIO_ASC&page=0&size=1', token)
            print('2. Scenarios list HTTP:', code, 'Total:', scen_res.get('data', {}).get('totalElements'))
            content = scen_res.get('data', {}).get('content', [])
            if not content:
                print('ERROR: No scenario content returned!', scen_res)
                exit(1)
            scenario = content[0]
            scenario_id = scenario.get('id')
            duration_ms = scenario.get('durationMs', 27000)
            print('   Scenario ID:', scenario_id, 'DurationMs:', duration_ms, 'Title:', scenario.get('name'))

            # 3. Create attempt
            code, att_res = post(f'{BASE}/attempts', {
                'eventId': str(uuid.uuid4()),
                'scenarioId': scenario_id,
                'licenseClass': 'B',
                'bankVersion': 'dts-simulation-120-video-v1'
            }, token)
            print('3. Create Attempt HTTP:', code, 'AttemptId:', att_res.get('data', {}).get('attemptId'))
            att = att_res.get('data', {})
            attempt_id = att.get('attemptId')
            playback_id = att.get('playbackEventId')

            # 4. Playback
            code, play_res = get(f'{BASE}/attempts/{attempt_id}/playback', token)
            print('4. Playback grant HTTP:', code, 'PlaybackId:', play_res.get('data', {}).get('playbackId'))
            playback_id = play_res.get('data', {}).get('playbackId', playback_id)

            # 5. Start
            code, start_res = post(f'{BASE}/attempts/{attempt_id}/start', {
                'eventId': str(uuid.uuid4()),
                'playbackEventId': playback_id,
                'mediaTimeMs': 0
            }, token)
            print('5. Start attempt HTTP:', code, 'Status:', start_res.get('data', {}).get('status'))

            # 6. Playback simulation with heartbeats
            print('6. Simulating playback with heartbeats and Space press...')
            start_time = time.time()
            for t in [3000, 6000, 9000, 12000, 15000, 18000, 21000, 24000]:
                elapsed = int((time.time() - start_time) * 1000)
                sleep_needed = (t - elapsed) / 1000.0
                if sleep_needed > 0:
                    time.sleep(sleep_needed)
                code, hb_res = post(f'{BASE}/attempts/{attempt_id}/heartbeat', {
                    'eventId': str(uuid.uuid4()),
                    'playbackEventId': playback_id,
                    'mediaTimeMs': t
                }, token)
                if t == 12000:
                    # User presses Space at 12000ms
                    code_resp, resp_data = post(f'{BASE}/attempts/{attempt_id}/response', {
                        'eventId': str(uuid.uuid4()),
                        'playbackEventId': playback_id,
                        'mediaTimeMs': 12000
                    }, token, method='PUT')
                    print('   -> Pressed Space at 12000ms HTTP:', code_resp, 'FirstResponseMs:', resp_data.get('data', {}).get('firstResponseMs'))

            # Wait until video completes at 27.0s
            elapsed = (time.time() - start_time)
            if elapsed < 27.0:
                time.sleep(27.0 - elapsed)

            # 7. Complete with 27000ms
            code, comp_res = post(f'{BASE}/attempts/{attempt_id}/complete', {
                'eventId': str(uuid.uuid4()),
                'playbackEventId': playback_id,
                'mediaTimeMs': 27000
            }, token)
            print('7. Complete attempt (27000ms) HTTP:', code, 'Status:', comp_res.get('data', {}).get('status'))
            if comp_res.get('data', {}).get('result'):
                res = comp_res['data']['result']
                print('   SUCCESS! Score:', res.get('score'), '/ 5, Status:', res.get('status'), 'ResponseMs:', res.get('firstResponseMs'))
            else:
                print('   Complete error / details:', comp_res)

            # 8. Test duration overflow tolerance (27098ms > 27000ms container duration)
            print('8. Testing duration overflow tolerance (27098ms container duration)...')
            code, att2_res = post(f'{BASE}/attempts', {
                'eventId': str(uuid.uuid4()),
                'scenarioId': scenario_id,
                'licenseClass': 'B',
                'bankVersion': 'dts-simulation-120-video-v1'
            }, token)
            att2_id = att2_res.get('data', {}).get('attemptId')
            code, play2 = get(f'{BASE}/attempts/{att2_id}/playback', token)
            pb2 = play2.get('data', {}).get('playbackId')
            post(f'{BASE}/attempts/{att2_id}/start', {'eventId': str(uuid.uuid4()), 'playbackEventId': pb2, 'mediaTimeMs': 0}, token)
            time.sleep(26.2)
            code, comp2 = post(f'{BASE}/attempts/{att2_id}/complete', {
                'eventId': str(uuid.uuid4()),
                'playbackEventId': pb2,
                'mediaTimeMs': 27098
            }, token)
            print('   Complete with 27098ms overflow HTTP:', code, 'Status:', comp2.get('data', {}).get('status'))
            if comp2.get('data', {}).get('result'):
                print('   OVERFLOW TEST PASSED! Score:', comp2['data']['result'].get('score'), 'Status:', comp2['data']['result'].get('status'))
            else:
                print('   Details:', comp2)
            print('=== ALL TESTS COMPLETED SUCCESSFULLY! ===')
            EOF
