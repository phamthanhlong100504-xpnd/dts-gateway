name: VPS Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Diagnostics on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "=== SEARCHING USER REQUEST TRACEID (2a273071) ==="
            docker logs dts-practice-service 2>&1 | grep -C 10 "2a273071" || true
            echo "=== ALL SIMULATION ERRORS IN LOG ==="
            docker logs dts-practice-service 2>&1 | grep -C 8 "Simulation HTTP error" || true
            docker logs dts-practice-service 2>&1 | grep -C 8 "Simulation HTTP call failed" || true
            docker logs dts-practice-service 2>&1 | grep -C 8 "Simulation thumbnail batch" || true
            docker logs dts-practice-service 2>&1 | grep -C 8 "Simulation HTTP interrupted" || true
            echo "=== TESTING HTTP CALL TO MEDIA FROM PRACTICE CONTAINER ==="
            docker exec dts-practice-service wget -qO- --timeout=5 http://103.20.96.85:8080/api/v1/media/simulation-catalog-thumbnail 2>&1 || true

