name: VPS Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Diagnostics on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "=== PRACTICE CONTAINER ENVIRONMENT ==="
            docker inspect dts-practice-service --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -i "SIMULATION" || true
            echo "=== SEARCHING EXACT TRACEID ==="
            docker logs dts-practice-service 2>&1 | grep -C 5 "5ac55481" || true
            echo "=== SEARCHING SIMULATION ERROR ==="
            docker logs dts-practice-service 2>&1 | grep -C 5 "Simulation HTTP" || true
            docker logs dts-practice-service 2>&1 | grep -C 5 "Simulation thumbnail" || true

