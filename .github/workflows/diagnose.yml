name: VPS Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Diagnostics on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "=== DOCKER CONTAINERS ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "=== PRACTICE SERVICE LOGS (LAST 120 LINES) ==="
            docker logs dts-practice-service --tail 120
            echo "=== MEDIA SERVICE LOGS (LAST 120 LINES) ==="
            docker logs media-service --tail 120
