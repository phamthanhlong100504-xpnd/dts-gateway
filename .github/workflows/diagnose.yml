name: VPS Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Diagnostics on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          timeout: 10m
          script: |
            echo "=== 1. DOCKER PS ==="
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "=== 2. DTS PRACTICE LOGS (LAST 100 LINES) ==="
            docker logs --tail 100 dts-practice-service

            echo "=== 3. GATEWAY HEALTH ==="
            curl -v http://localhost:8888/actuator/health || true

            echo "=== 4. TEST FROM INSIDE DOCKER NETWORK ==="
            docker run --rm --network dts-network curlimages/curl:latest -v http://dts-practice-service:8087/actuator/health || true
            docker run --rm --network dts-network curlimages/curl:latest -v http://gateway-service:8888/actuator/health || true
