name: VPS Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Diagnostics on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "=== PRACTICE LOGS FOR SIMULATION ==="
            docker logs dts-practice-service 2>&1 | grep -i -C 3 "Simulation" | tail -n 60 || true
            echo "=== PRACTICE LOGS TAIL 60 ==="
            docker logs dts-practice-service --tail 60 || true

