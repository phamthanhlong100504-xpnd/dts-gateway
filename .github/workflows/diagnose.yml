name: VPS Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Diagnostics on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "=== HOST INFO ==="
            uname -a
            hostname -I
            echo "=== /dts DIRECTORY CONTENTS ==="
            ls -la /dts/
            echo "=== /dts/media CONTENTS ==="
            ls -la /dts/media/ || true
            echo "=== DOCKER COMPOSE IN /dts/media ==="
            cd /dts/media && docker compose ps -a || true
            cd /dts/media && docker compose config || true
            echo "=== ALL RUNNING/STOPPED CONTAINERS ==="
            docker ps -a

