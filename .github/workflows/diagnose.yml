name: VPS Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Diagnostics on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "=== PRACTICE LOGS FILTERED (NO EUREKA) ==="
            docker logs dts-practice-service 2>&1 | grep -v "Eureka" | grep -v "DiscoveryClient" | tail -n 200
            echo "=== PRACTICE LOGS WITH ERRORS / CONFLICTS ==="
            docker logs dts-practice-service 2>&1 | grep -iE "SIMULATION_|conflict|Exception|500|409|400" | tail -n 100
