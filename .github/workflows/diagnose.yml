name: VPS Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Diagnostics on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          timeout: 5m
          script: |
            echo "=== 1. TEST FRONTEND HTTP FROM VPS 2 ==="
            curl -I http://103.20.96.85:3000/practice/simulations/chapters/1 || true

            echo "=== 2. TEST PRACTICE SERVICE ACTUATOR DIRECT ==="
            docker run --rm --network dts-network curlimages/curl:latest http://dts-practice-service:8087/actuator/health || true
