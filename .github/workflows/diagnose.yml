name: VPS Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Diagnostics on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "=== TESTING CONNECTIVITY TO VPS 1 (103.20.96.85) FROM VPS 2 ==="
            echo "--- Identity 8081 ---"
            curl -s -i "http://103.20.96.85:8081/actuator/health" --max-time 5 || true
            echo "--- Media 8080 ---"
            curl -s -i "http://103.20.96.85:8080/actuator/health" --max-time 5 || true
            echo "--- Media MinIO 9000 ---"
            curl -s -i "http://103.20.96.85:9000/minio/health/live" --max-time 5 || true

