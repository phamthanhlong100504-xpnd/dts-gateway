name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/gateway-service
  DEPLOY_DIR: /dts/gateway

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Gateway Service
        run: |
          chmod +x mvnw
          ./mvnw clean package -B -DskipTests

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Images
        run: |
          # Gateway
          docker build -t $GATEWAY_IMAGE:latest -t $GATEWAY_IMAGE:${{ github.sha }} .
          docker push $GATEWAY_IMAGE:latest
          docker push $GATEWAY_IMAGE:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            mkdir -p ${{ env.DEPLOY_DIR }}
            docker network create dts-network || true
            ufw allow 8888/tcp || true
            cd ${{ env.DEPLOY_DIR }}
            export GITHUB_OWNER=${{ github.repository_owner }}
            cat << 'EOF' > docker-compose.yml
services:
  gateway-service:
    image: ghcr.io/${GITHUB_OWNER:-phamthanhlong100504-xpnd}/gateway-service:latest
    container_name: gateway-service
    restart: unless-stopped
    ports:
      - "8888:8888"
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true -Xms128m -Xmx384m"
      IDENTITY_SERVICE_URL: "http://103.20.96.85:8081"
      PRACTICE_SERVICE_URL: "http://dts-practice-service:8087"
      PROGRESS_SERVICE_URL: "http://dts-progress:8083"
      MEDIA_SERVICE_URL: "http://media-service:8080"
      EXAMINATION_SERVICE_URL: "http://examination:8088"
      RESULT_SERVICE_URL: "http://dts-result:8080"
    networks:
      - dts-network

networks:
  dts-network:
    external: true
EOF
            sed -i "s/\${GITHUB_OWNER}/$GITHUB_OWNER/g" docker-compose.yml
            docker logout ghcr.io || true
            docker compose pull || { docker login ghcr.io -u phamthanhlong100504-xpnd -p ${{ secrets.GHCR_TOKEN }} && docker compose pull; }
            docker compose up -d
            docker compose ps -a | grep -q Up || { echo "ERROR: gateway-service not running"; exit 1; }
            docker restart dts-practice-service || true
            docker image prune -a -f
