name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/gateway-service
  DEPLOY_DIR: /dts/gateway

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Gateway Service
        run: |
          chmod +x mvnw
          ./mvnw clean package -B -DskipTests

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Images
        run: |
          # Gateway
          docker build -t $GATEWAY_IMAGE:latest -t $GATEWAY_IMAGE:${{ github.sha }} .
          docker push $GATEWAY_IMAGE:latest
          docker push $GATEWAY_IMAGE:${{ github.sha }}

      - name: Prepare docker-compose payload
        id: compose
        run: |
          echo "B64=$(base64 -w 0 docker-compose.prod.yml)" >> $GITHUB_OUTPUT

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          COMPOSE_B64: ${{ steps.compose.outputs.B64 }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: COMPOSE_B64,GITHUB_OWNER,GHCR_TOKEN
          script: |
            set -e
            mkdir -p ${{ env.DEPLOY_DIR }}
            docker network create dts-network || true
            ufw allow 8888/tcp || true
            cd ${{ env.DEPLOY_DIR }}
            echo "$COMPOSE_B64" | base64 -d > docker-compose.yml
            export GITHUB_OWNER=$(echo "$GITHUB_OWNER" | tr '[:upper:]' '[:lower:]')
            sed -i "s/\${GITHUB_OWNER}/$GITHUB_OWNER/g" docker-compose.yml
            docker logout ghcr.io || true
            docker compose pull || { docker login ghcr.io -u phamthanhlong100504-xpnd -p $GHCR_TOKEN && docker compose pull; }
            docker compose up -d
            docker compose ps -a | grep -q Up || { echo "ERROR: gateway-service not running"; exit 1; }
            docker restart dts-practice-service || true
            docker image prune -a -f
