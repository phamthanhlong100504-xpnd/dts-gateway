name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/gateway-service
  EUREKA_IMAGE: ghcr.io/${{ github.repository_owner }}/eureka-server
  DEPLOY_DIR: /dts/gateway

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Eureka Server
        working-directory: ./eureka-server
        run: |
          chmod +x mvnw
          ./mvnw clean package -B -DskipTests

      - name: Build Gateway Service
        run: |
          chmod +x mvnw
          ./mvnw clean package -B -DskipTests

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Images
        run: |
          # Gateway
          docker build -t $GATEWAY_IMAGE:latest -t $GATEWAY_IMAGE:${{ github.sha }} .
          docker push $GATEWAY_IMAGE:latest
          docker push $GATEWAY_IMAGE:${{ github.sha }}
          
          # Eureka
          cd eureka-server
          docker build -t $EUREKA_IMAGE:latest -t $EUREKA_IMAGE:${{ github.sha }} .
          docker push $EUREKA_IMAGE:latest
          docker push $EUREKA_IMAGE:${{ github.sha }}

      - name: Prepare VPS Directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            mkdir -p ${{ env.DEPLOY_DIR }}

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "docker-compose.prod.yml"
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            cd ${{ env.DEPLOY_DIR }}
            mv -f docker-compose.prod.yml docker-compose.yml
            export GITHUB_OWNER=${{ github.repository_owner }}
            docker compose pull
            docker compose up -d
            docker image prune -a -f
